# DRAFT for review. Not installed anywhere.
#
# Private SSH-tunnel preview: http://ats-admin.localhost:5070
# Reconcile with the existing preview configuration (`sudo nginx -T`) first:
# if something already listens on 127.0.0.1:5070, merge rather than add.
#
# Tunnel from the PC:
#   ssh -N -L 127.0.0.1:5070:127.0.0.1:5070 ubuntu@51.21.242.89
#
# The auth service is reached over its Unix socket, which only the service
# and nginx (a member of group ats-admin) can open; see ats-admin-auth.service.

# Overall throttle on the login route (the service also limits and locks).
# NOTE: keyed globally, so any client can exhaust it for everyone. Acceptable
# only while the preview is reachable solely through SSH; must be replaced
# (real client IP, Cloudflare Access) before any public exposure.
limit_req_zone $server_name zone=ats_admin_login:1m rate=10r/m;

upstream ats_admin_auth {
    server unix:/run/ats-admin-auth/auth.sock;
}

# Anything that is not ats-admin.localhost is dropped without a response.
server {
    listen 127.0.0.1:5070 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:5070;
    server_name ats-admin.localhost;

    root /var/www/ats-admin/current;
    index index.html;
    client_max_body_size 16k;
    server_tokens off;

    # Inherited by every location below, because no location uses add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/admin/auth/login {
        limit_req zone=ats_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ats_admin_auth;
        proxy_http_version 1.1;
        # $http_host keeps the port, which the service compares exactly.
        proxy_set_header Host $http_host;
        # Overwrite, never append: exactly one address, which the service
        # believes only because the socket admits nginx alone.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
    }

    location /api/admin/ {
        proxy_pass http://ats_admin_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
    }

    # The customer API is never reachable from the admin host.
    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
