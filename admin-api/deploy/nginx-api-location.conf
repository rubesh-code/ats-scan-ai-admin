# Goes inside the `listen 443` server block for admin.atsscanai.com
# (/etc/nginx/conf.d/ats-admin-public.conf), next to `location /`.
location /api/admin/ {
    proxy_pass http://127.0.0.1:5080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cf-Access-Jwt-Assertion and Cf-Connecting-Ip pass through unchanged;
    # the API verifies the token itself.
}
